<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Language Learner logo: the Monkey King's golden staff over a somersault cloud, in a red seal -->
  <defs>
    <radialGradient id="seal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#d8392a"/>
      <stop offset="1" stop-color="#7e170f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="0.55" stop-color="#e8b23a"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#seal)" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ffd97a" stroke-opacity="0.45" stroke-width="1"/>
  <!-- golden staff (如意金箍棒) with red bands -->
  <line x1="16" y1="45" x2="47" y2="14" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="16" y1="45" x2="19.5" y2="41.5" stroke="#b8261c" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="43.5" y1="17.5" x2="47" y2="14" stroke="#b8261c" stroke-width="4.5" stroke-linecap="round"/>
  <!-- somersault cloud (筋斗云) -->
  <path d="M15 47a6 6 0 0 1 8-6.5a8.5 8.5 0 0 1 15.5-1.5a6.5 6.5 0 0 1 9.5 6.5a4.5 4.5 0 0 1-1.5 8.5H18.5A4.5 4.5 0 0 1 15 47z"
        fill="#fbe9c8" stroke="#e8b23a" stroke-width="1.5"/>
  <path d="M27 49c-3 0-4-3.5-1.5-5s5 0.5 4 3" fill="none" stroke="#e8b23a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M38 49c2.5 0 3.5-3 1.3-4.3s-4.3 0.5-3.4 2.6" fill="none" stroke="#e8b23a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
