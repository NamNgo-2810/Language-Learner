services:
  - type: web
    name: learn-languages
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Paste the full service-account key JSON as the value (single line).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # The spreadsheet ID (from the sheet URL). Or set it in languages.json.
      - key: GOOGLE_SHEET_ID
        sync: false
